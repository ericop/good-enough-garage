<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Good Enough Garage</title>
  <style>
    :root {
      --bg: #11161d;
      --bg-2: #0b0f14;
      --panel: #1a222c;
      --panel-2: #222d3a;
      --line: #324150;
      --ink: #eef3f8;
      --muted: #9fb0c0;
      --accent: #ffc94a;     /* caution-tape amber */
      --accent-ink: #2a2102;
      --good: #4ec77d;       /* ship / commit green */
      --good-dark: #2f9d5c;
      --bad: #ef5d5d;
      --rush: #ff7a45;
      --comeback: #c07be0;
      --eng: #ef5d5d;
      --brk: #ff9f45;
      --ele: #ffd24a;
      --bod: #5aa9ff;
      --radius: 12px;
      --tap: 44px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1b2733, var(--bg)) fixed;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    #app { max-width: 1100px; margin: 0 auto; padding: 10px 12px 40px; }

    /* ---------- header ---------- */
    .app-header {
      position: sticky; top: 0; z-index: 5;
      background: linear-gradient(var(--bg), rgba(17,22,29,.92));
      padding: 8px 0 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .brand-name {
      font-weight: 800; letter-spacing: .3px; font-size: 1.15rem;
      background: linear-gradient(90deg, var(--accent), #ffe6a0);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand-name::before { content: "🔧 "; -webkit-text-fill-color: initial; }

    .statbar { display: flex; flex-wrap: wrap; gap: 6px; }
    .stat {
      display: flex; flex-direction: column; align-items: flex-start;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 9px; padding: 5px 9px; min-width: 64px; flex: 1 1 auto;
    }
    .stat-label { font-size: .62rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .stat-value { font-size: 1.02rem; font-weight: 700; }
    .stat.danger .stat-value { color: var(--bad); }

    /* ---------- layout ---------- */
    .help { color: var(--muted); font-size: .82rem; margin: 0 2px 8px; }
    .floor-cols { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 760px) { .floor-cols { grid-template-columns: 1fr 1fr; } }

    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px;
    }
    .panel-title { margin: 0 0 8px; font-size: 1rem; display: flex; align-items: baseline; gap: 6px; }
    .panel-title .count { color: var(--muted); font-weight: 600; font-size: .85rem; }
    .cards { display: flex; flex-direction: column; gap: 8px; }
    .empty { color: var(--muted); font-style: italic; margin: 6px 2px; }

    /* ---------- car cards ---------- */
    .card {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 10px;
    }
    .car.rush { border-color: var(--rush); box-shadow: 0 0 0 1px rgba(255,122,69,.25) inset; }
    .car.comeback { border-color: var(--comeback); }
    .car-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; margin-bottom: 6px; }
    .car-id { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .car-model { font-weight: 800; font-size: 1.05rem; }
    .car-cust { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .complaint { font-size: .9rem; margin-bottom: 6px; }
    .complaint em { color: var(--accent); font-style: italic; }
    .rush-line { font-size: .8rem; color: var(--rush); margin-bottom: 8px; }

    .badge {
      font-size: .62rem; font-weight: 800; letter-spacing: .5px;
      padding: 2px 6px; border-radius: 999px; text-transform: uppercase;
    }
    .rush-badge { background: var(--rush); color: #2a0e02; }
    .comeback-badge { background: var(--comeback); color: #240a30; }
    .exp-badge { background: var(--good); color: #06240f; }

    /* patience */
    .patience { margin-bottom: 8px; }
    .p-label { font-size: .72rem; color: var(--muted); }
    .p-bar { height: 7px; background: #0e141b; border-radius: 999px; overflow: hidden; margin-top: 3px; }
    .p-fill { height: 100%; background: var(--good); transition: width .2s ease; }
    .p-fill.low { background: var(--bad); }

    /* ---------- faults ---------- */
    .faults { display: flex; flex-direction: column; gap: 6px; margin: 0 0 8px; }
    .fault, .fault-wrap > .fault {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      background: #14202c; border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 8px; font-size: .9rem;
    }
    .fault.hidden { color: var(--muted); border-style: dashed; }
    .f-q { font-weight: 800; letter-spacing: 2px; }
    .f-hint { font-size: .72rem; }
    .fault.repaired { border-color: var(--good-dark); }
    .f-check { color: var(--good); font-weight: 800; }
    .f-label { font-weight: 600; }
    .f-spec { font-size: .68rem; color: var(--accent); }
    .fault .btn-repair { margin-left: auto; }

    .type-badge {
      font-size: .65rem; text-transform: uppercase; letter-spacing: .4px;
      padding: 1px 6px; border-radius: 999px; font-weight: 700; color: #0b0f14;
    }
    .type-engine { background: var(--eng); }
    .type-brakes { background: var(--brk); }
    .type-electrical { background: var(--ele); }
    .type-body { background: var(--bod); }

    .mech-picker { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 4px; }
    .mech-picker .mech { flex: 1 1 auto; }
    .mech.match { border-color: var(--accent); color: var(--accent); }

    /* ---------- buttons ---------- */
    .btn {
      min-height: var(--tap); min-width: var(--tap);
      padding: 8px 14px; font-size: 1rem; font-weight: 700;
      border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel); color: var(--ink); cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: transform .05s ease, filter .15s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: .42; cursor: not-allowed; filter: none; }

    .btn-intake { width: 100%; background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .bay-actions { display: flex; gap: 8px; }
    .btn-diagnose { flex: 1 1 0; }
    .btn-ship {
      flex: 2 1 0; min-height: 52px; font-size: 1.1rem; font-weight: 800;
      background: linear-gradient(180deg, var(--good), var(--good-dark));
      color: #06240f; border-color: transparent;
      box-shadow: 0 3px 0 #1e6e3f, 0 6px 14px rgba(78,199,125,.25);
    }
    .btn-ship:active { box-shadow: 0 1px 0 #1e6e3f; }

    .floor-actions { margin: 14px 0; }
    .btn-end { width: 100%; background: var(--panel-2); border-color: var(--line); }

    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; width: 100%; }

    /* ---------- log ---------- */
    .log { margin-top: 12px; }
    .log-list { display: flex; flex-direction: column; gap: 4px; }
    .log-line { font-size: .82rem; color: var(--muted); padding: 4px 6px; background: #131b24; border-radius: 6px; }

    /* ---------- shop ---------- */
    .screen-title { margin: 4px 0 6px; }
    .shop-cards { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 12px 0; }
    @media (min-width: 620px) { .shop-cards { grid-template-columns: repeat(3, 1fr); } }
    .upgrade { display: flex; flex-direction: column; gap: 6px; }
    .upgrade.bought { opacity: .7; }
    .up-name { font-weight: 800; font-size: 1.05rem; }
    .up-desc { color: var(--muted); font-size: .85rem; flex: 1; }
    .up-cost { font-weight: 800; color: var(--accent); }
    .btn-buy { width: 100%; }

    /* ---------- game over ---------- */
    .gameover { text-align: center; padding: 40px 14px; max-width: 480px; margin: 0 auto; }
    .go-title { font-size: 2rem; margin: 0 0 8px; }
    .go-title.win { color: var(--good); }
    .go-title.lose { color: var(--bad); }
    .go-result { font-size: 1.1rem; margin-bottom: 18px; }
    .go-summary { display: flex; flex-direction: column; gap: 6px; color: var(--muted); margin-bottom: 22px; }
    .go-summary b { color: var(--ink); }

    /* ---------- menu + modals ---------- */
    .menu-wrap { position: relative; flex-shrink: 0; }
    .btn-menu {
      min-height: 44px; min-width: 44px; padding: 0 12px;
      font-size: 1.3rem; line-height: 1; background: var(--panel-2);
      border: 1px solid var(--line); color: var(--ink); border-radius: 10px; cursor: pointer;
    }
    .menu-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 8;
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      padding: 6px; min-width: 210px; display: flex; flex-direction: column; gap: 4px;
    }
    .menu-item {
      text-align: left; background: transparent; border: 0; color: var(--ink);
      font-size: 1rem; font-weight: 600; padding: 12px; border-radius: 8px;
      min-height: 44px; cursor: pointer;
    }
    .menu-item:hover { background: var(--panel); }
    .menu-backdrop { position: fixed; inset: 0; z-index: 3; background: transparent; }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; display: flex;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(0, 0, 0, 0.6); animation: fade-in 0.15s ease;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: min(460px, 94vw); max-height: 86vh; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); padding: 16px;
      animation: toast-in 0.16s ease;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .modal-title { margin: 0; font-size: 1.2rem; }
    .modal-close {
      min-height: 40px; min-width: 40px; padding: 0; font-size: 1.1rem; cursor: pointer;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); border-radius: 9px;
    }
    .modal-sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 10px; }
    .modal-hint { color: var(--muted); font-size: 0.8rem; font-style: italic; margin: 12px 0 0; }

    .staff-list { display: flex; flex-direction: column; gap: 8px; }
    .staff-row { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    .staff-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .staff-name { font-weight: 800; font-size: 1.02rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .staff-specs { display: flex; gap: 4px; flex-wrap: wrap; }
    .staff-bio { color: var(--muted); font-size: 0.84rem; }
    .staff-tools-title { margin-top: 14px; margin-bottom: 6px; color: var(--text, var(--ink)); font-weight: 700; }
    .staff-tools { display: flex; flex-wrap: wrap; gap: 6px; }
    .tool-chip { background: var(--panel-2); border: 1px solid var(--line); color: #eadfce; border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; }

    .howto-step { text-align: center; padding: 6px 4px 4px; min-height: 168px; }
    .howto-icon { font-size: 2.4rem; margin-bottom: 6px; }
    .howto-title { margin: 0 0 6px; font-size: 1.12rem; }
    .howto-body { color: var(--muted); font-size: 0.92rem; margin: 0 auto; max-width: 38ch; }
    .howto-dots { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
    .howto-dots .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--line); }
    .howto-dots .dot.on { background: var(--accent); }
    .howto-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .howto-count { color: var(--muted); font-size: 0.82rem; }
    .howto-done { width: auto; }

    /* ---------- score / progress ---------- */
    .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .score-stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
    .score-num { display: block; font-size: 1.12rem; font-weight: 800; }
    .score-label { display: block; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-top: 2px; }

    .final-score { text-align: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 14px 0; }
    .final-score.newbest { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .fs-num { display: block; font-size: 2.3rem; font-weight: 900; color: var(--accent); line-height: 1; }
    .fs-label { display: block; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-top: 5px; }
    .final-score.newbest .fs-label { color: var(--accent); }

    .unlock-list { display: flex; flex-direction: column; gap: 8px; }
    .unlock-row { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    .unlock-row.owned { border-color: var(--good-dark); }
    .unlock-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .unlock-name { font-weight: 800; font-size: 0.95rem; }
    .unlock-row.owned .unlock-name { color: var(--good); }
    .unlock-req { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .unlock-desc { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
    .unlock-prog { height: 5px; background: #0e141b; border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .unlock-prog-fill { height: 100%; background: var(--accent); }

    .reset-row { margin-top: 14px; text-align: center; }
    .reset-btn { width: auto; min-height: 40px; padding: 8px 14px; font-size: 0.82rem; cursor: pointer; }
    .reset-btn.armed { background: var(--bad); color: #fff; border-color: var(--bad); }

    .go-unlocks { background: rgba(255, 201, 74, 0.1); border: 1px solid rgba(255, 201, 74, 0.3); border-radius: 12px; padding: 10px 12px; margin: 8px 0 4px; text-align: left; }
    .go-unlocks-title { font-weight: 800; margin-bottom: 6px; }
    .go-unlock { font-size: 0.84rem; color: var(--muted); margin-top: 2px; }
    .go-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

    /* ---------- engine: quota bar, renown, art ---------- */
    .quota-bar { position: relative; height: 22px; margin-top: 8px; background: #0e141b; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .quota-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #ffe0a0); transition: width .3s ease; }
    .quota-fill.met { background: linear-gradient(90deg, var(--good), #8be0ab); }
    .quota-bar-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: .74rem; font-weight: 700; color: var(--ink); text-shadow: 0 1px 2px rgba(0,0,0,.6); }

    .veh-icon { display: inline-flex; align-items: center; }
    .veh-icon .veh { width: 34px; height: 19px; display: block; }

    .persona { flex-shrink: 0; }
    .persona .persona-svg { width: 46px; height: 46px; display: block; border-radius: 10px; background: #14202c; border: 1px solid var(--line); }
    .staff-row { display: flex; gap: 10px; align-items: flex-start; }
    .staff-row.exp { border-color: rgba(78,199,125,.5); }
    .staff-info { min-width: 0; flex: 1; }

    .renown-list { display: flex; flex-direction: column; gap: 7px; }
    .renown-row { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
    .renown-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
    .renown-tier { font-size: .76rem; color: var(--muted); font-weight: 700; }
    .renown-bar { height: 5px; background: #0e141b; border-radius: 999px; overflow: hidden; }
    .renown-fill { height: 100%; background: var(--accent); transition: width .3s ease; }

    .day-summary { display: flex; flex-direction: column; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 6px 0 10px; font-size: .9rem; color: var(--muted); }
    .day-summary b { color: var(--ink); }
    .day-summary .warn b { color: var(--comeback); }

    /* ---------- intake fly-in animation ---------- */
    .fly-car { position: fixed; z-index: 80; pointer-events: none; will-change: transform; }
    .fly-car .veh { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
    .fly-smoke { position: absolute; left: 0; bottom: 0; width: 0; height: 0; }
    .fly-puff {
      position: absolute; left: -4px; bottom: -2px; width: 9px; height: 9px; border-radius: 50%;
      background: radial-gradient(circle, rgba(222,222,230,.75), rgba(180,180,190,0) 70%);
      opacity: 0; animation: puff .55s ease-out forwards;
    }
    .fly-puff.p2 { left: -8px; bottom: 1px; animation-delay: .08s; }
    .fly-puff.p3 { left: -1px; bottom: 2px; animation-delay: .16s; }
    @keyframes puff {
      0% { opacity: .7; transform: translate(0,0) scale(.4); }
      100% { opacity: 0; transform: translate(-13px,3px) scale(1.8); }
    }
    /* floating payout on Ship It */
    .float-cash {
      position: fixed; z-index: 82; pointer-events: none; transform: translate(-50%, 0);
      font-weight: 900; font-size: 1.05rem; color: var(--accent);
      text-shadow: 0 2px 4px rgba(0,0,0,.65); white-space: nowrap;
    }
    .float-cash.clean { color: var(--good); }

    /* mechanic salute + speech bubble on repair */
    .salute-pop { display: flex; align-items: center; gap: 6px; animation: salute-in .25s ease-out, salute-out .4s ease-in 1.3s forwards; }
    @keyframes salute-in { from { opacity: 0; transform: translateY(10px) scale(.8); } to { opacity: 1; transform: none; } }
    @keyframes salute-out { to { opacity: 0; transform: translateY(-10px); } }
    .salute-persona svg { width: 40px; height: 40px; display: block; border-radius: 8px; background: #14202c; border: 1px solid var(--line); box-shadow: 0 4px 10px rgba(0,0,0,.4); }
    .salute-hand { font-size: 1.15rem; animation: salute-wave .65s ease-in-out forwards; }
    @keyframes salute-wave { 0% { opacity: 0; transform: translateY(8px) rotate(-12deg); } 35% { opacity: 1; } 60% { transform: translateY(-4px) rotate(10deg); } 100% { opacity: 0; transform: translateY(-2px) rotate(0); } }
    .salute-bubble { opacity: 0; background: #f4f1ea; color: #222; font-weight: 700; font-size: .8rem; padding: 5px 9px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.45); position: relative; animation: bubble-in .3s ease-out .4s forwards; }
    .salute-bubble::before { content: ''; position: absolute; left: -5px; top: 50%; transform: translateY(-50%); border: 5px solid transparent; border-right-color: #f4f1ea; }
    @keyframes bubble-in { from { opacity: 0; transform: translateX(-6px) scale(.92); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) { .fly-car, .salute-pop, .float-cash { display: none; } }

    /* ---------- toasts ---------- */
    .toast-wrap { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 50; padding: 0 10px; }
    .toast {
      background: var(--comeback); color: #fff; font-weight: 700;
      padding: 10px 16px; border-radius: 999px; max-width: 92vw; text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: toast-in .25s ease;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="app" data-screen="floor"></div>
  <noscript style="color:#fff;display:block;padding:20px;text-align:center">Good Enough Garage needs JavaScript enabled.</noscript>
  <script src="game.js" defer></script>
</body>
</html>
